databases:
  - name: cotizador-casa-diseno-v2-db
    plan: free
    databaseName: cotizador_casa_diseno
    user: cotizador

services:
  - type: web
    name: cotizador-casa-diseno-v2
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cotizador-casa-diseno-v2-db
          property: connectionString
